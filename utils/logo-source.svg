<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#1A1A28"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- corner brackets, same sci-fi tablet motif as the sibling quick-notes app -->
  <path d="M 96 150 V 108 Q 96 96 108 96 H 150" fill="none" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
  <path d="M 416 150 V 108 Q 416 96 404 96 H 362" fill="none" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
  <path d="M 96 362 V 404 Q 96 416 108 416 H 150" fill="none" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <path d="M 416 362 V 404 Q 416 416 404 416 H 362" fill="none" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- wallet/card outline -->
  <rect x="146" y="176" width="220" height="160" rx="22" fill="none" stroke="#F8FAFC" stroke-width="14"/>
  <path d="M 146 224 H 366" stroke="#F8FAFC" stroke-width="10"/>

  <!-- balance coin: half green (te deben), half red (debes) -->
  <circle cx="256" cy="290" r="46" fill="url(#coin)"/>
  <text x="256" y="306" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#0B0B12" text-anchor="middle">$</text>
</svg>
